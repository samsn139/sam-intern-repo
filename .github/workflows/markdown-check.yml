name: Markdown Lint and Spell Check

on:
  pull_request:
    paths:
      - '**/*.md'

jobs:
  lint-and-spellcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install -g markdownlint-cli cspell

      - name: Run markdownlint
        run: markdownlint "**/*.md"

      - name: Run cspell (Spell Checker)
        run: cspell "**/*.md" --no-progress --no-summary
